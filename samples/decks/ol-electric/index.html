<!-- 2 I, V, R -->
<section class="slide" data-id="ivr">
  <span class="kick" data-en="Three words you must know" data-si="දැනගත යුතු වචන තුනක්"></span>
  <h2 data-en="Current, voltage, resistance" data-si="ධාරාව, වෝල්ටීයතාව, ප්‍රතිරෝධය"></h2>
  <div class="trio">
    <div class="card"><b class="sym">I</b><h3 data-en="Current" data-si="ධාරාව"></h3><p data-en="How much charge flows past a point each second." data-si="තත්පරයකදී ලක්ෂ්‍යයක් පසුකර ගලන ආරෝපණ ප්‍රමාණය."></p><div class="u"><span data-en="unit" data-si="ඒකකය"></span> <b>ampere (A)</b></div><div class="u"><span data-en="measured with" data-si="මනින්නේ"></span> <b data-en="an ammeter, in series" data-si="ඇමීටරයකින්, ශ්‍රේණිගතව"></b></div><div class="w" data-en="Water: how much water flows" data-si="ජලය: ගලන ජල ප්‍රමාණය"></div></div>
    <div class="card"><b class="sym">V</b><h3 data-en="Voltage" data-si="වෝල්ටීයතාව"></h3><p data-en="The push that drives the charge round the circuit (potential difference)." data-si="ආරෝපණය පරිපථය වටා තල්ලු කරන බලය (විභව අන්තරය)."></p><div class="u"><span data-en="unit" data-si="ඒකකය"></span> <b>volt (V)</b></div><div class="u"><span data-en="measured with" data-si="මනින්නේ"></span> <b data-en="a voltmeter, in parallel" data-si="වෝල්ට්මීටරයකින්, සමාන්තරව"></b></div><div class="w" data-en="Water: how hard the pump pushes" data-si="ජලය: පොම්පය තල්ලු කරන තරම"></div></div>
    <div class="card"><b class="sym">R</b><h3 data-en="Resistance" data-si="ප්‍රතිරෝධය"></h3><p data-en="How much a part slows the current down." data-si="කොටසක් ධාරාව අඩු කරන තරම."></p><div class="u"><span data-en="unit" data-si="ඒකකය"></span> <b>ohm (Ω)</b></div><div class="u"><span data-en="found from" data-si="සොයන්නේ"></span> <b>R = V / I</b></div><div class="w" data-en="Water: how narrow the pipe is" data-si="ජලය: බටය කෙතරම් පටුද"></div></div>
  </div>
</section>

<!-- 5 Ohm's law -->

  <span class="kick" data-en="The rule behind it all" data-si="සියල්ලට පදනම වන නීතිය"></span>

<!-- 6 resistors -->
<section class="slide" data-id="combine">
  <span class="kick" data-en="Adding resistors" data-si="ප්‍රතිරෝධක එකතු කිරීම"></span>
  <h2 data-en="Series or parallel?" data-si="ශ්‍රේණිගතද සමාන්තරද?"></h2>
  <div class="comb nodrag">
    <div class="panel">
      <div class="row2"><label>R<sub>1</sub></label><input type="range" id="c1" min="1" max="30" value="6"><b id="c1o"></b></div>
      <div class="row2"><label>R<sub>2</sub></label><input type="range" id="c2" min="1" max="30" value="3"><b id="c2o"></b></div>
    </div>
    <div class="panel res2"><h3 data-en="Series" data-si="ශ්‍රේණිගත"></h3><svg viewBox="0 0 360 90"><path class="w2" d="M10 45 H70"/><path class="rz" d="M70 45 l8 -14 l14 28 l14 -28 l14 28 l14 -28 l8 14"/><path class="w2" d="M150 45 H210"/><path class="rz" d="M210 45 l8 -14 l14 28 l14 -28 l14 28 l14 -28 l8 14"/><path class="w2" d="M290 45 H350"/></svg>
      <p class="f">R = R<sub>1</sub> + R<sub>2</sub></p><b class="ans" id="cS"></b><p class="say2" data-en="Always bigger than the biggest one." data-si="සෑම විටම විශාලතම එකට වඩා විශාලයි."></p></div>
    <div class="panel res2"><h3 data-en="Parallel" data-si="සමාන්තර"></h3><svg viewBox="0 0 360 120"><path class="w2" d="M10 60 H90 M90 25 V95 M270 25 V95 M270 60 H350 M90 25 H140 M220 25 H270 M90 95 H140 M220 95 H270"/><path class="rz" d="M140 25 l6 -12 l12 24 l12 -24 l12 24 l12 -24 l14 12"/><path class="rz" d="M140 95 l6 -12 l12 24 l12 -24 l12 24 l12 -24 l14 12"/></svg>
      <p class="f"><span class="fr2"><i>1</i><i>R</i></span> = <span class="fr2"><i>1</i><i>R<sub>1</sub></i></span> + <span class="fr2"><i>1</i><i>R<sub>2</sub></i></span></p><b class="ans" id="cP"></b><p class="say2" data-en="Always smaller than the smallest one." data-si="සෑම විටම කුඩාම එකට වඩා කුඩායි."></p></div>

      <div class="kv big"><span data-en="Cost per month" data-si="මසකට වියදම"></span><b id="eCost"></b></div>

<!-- 8 safety: fuse -->
<section class="slide" data-id="fuse">
  <span class="kick" data-en="Simulation · staying safe" data-si="සිමියුලේෂන් · ආරක්ෂාව"></span>
  <h2 data-en="Why a fuse melts" data-si="විලායකය දිය වන්නේ ඇයි"></h2>
  <div class="fz nodrag">
    <div class="panel">
      <p class="say2" data-en="Plug more appliances into one 230 V socket. The current adds up. Above 13 A the fuse melts and cuts the circuit before the wires get hot." data-si="එක 230 V කෙවෙනියකට තවත් උපකරණ සම්බන්ධ කරන්න. ධාරාව එකතු වේ. 13 A ඉක්මවූ විට කම්බි රත් වීමට පෙර විලායකය දිය වී පරිපථය කපා හරී."></p>
      <div class="plugs" id="plugs"></div>
      <button class="reset" id="fReset"><span data-en="Replace the fuse" data-si="විලායකය මාරු කරන්න"></span></button>
    </div>
    <div class="panel fview">

      <div class="amp"><span>I =</span><b id="fI">0.0 A</b></div>
      <div class="bar13"><i id="fBar"></i><em>13 A</em></div>
      <p class="fmsg" id="fMsg"></p>
    </div>
  </div>
</section>

<!-- 9 quiz -->
<section class="slide" data-id="quiz">
  <span class="kick" data-en="Paper style" data-si="ප්‍රශ්න පත්‍ර ආකාරයට"></span>
  <h2 data-en="Try these" data-si="උත්තර දෙන්න"></h2>
  <div class="mcq" data-ans="3">
    <p class="q" data-en="A 12 V battery drives 3 A through a lamp. The resistance of the lamp is" data-si="12 V බැටරියක් ලාම්පුවක් හරහා 3 A ධාරාවක් යවයි. ලාම්පුවේ ප්‍රතිරෝධය"></p>
    <ol><li><button>36 Ω</button></li><li><button>15 Ω</button></li><li><button>4 Ω</button></li><li><button>0.25 Ω</button></li></ol>
    <p class="why" data-en="R = V ÷ I = 12 ÷ 3 = 4 Ω." data-si="R = V ÷ I = 12 ÷ 3 = 4 Ω."></p>
  </div>
  <div class="mcq" data-ans="2">
    <p class="q" data-en="Two 6 Ω resistors are connected in parallel. The total resistance is" data-si="6 Ω ප්‍රතිරෝධක දෙකක් සමාන්තරව සම්බන්ධ කර ඇත. මුළු ප්‍රතිරෝධය"></p>
    <ol><li><button>12 Ω</button></li><li><button>3 Ω</button></li><li><button>6 Ω</button></li><li><button>36 Ω</button></li></ol>
    <p class="why" data-en="1/R = 1/6 + 1/6 = 2/6, so R = 3 Ω." data-si="1/R = 1/6 + 1/6 = 2/6, එබැවින් R = 3 Ω."></p>
  </div>
  <div class="mcq" data-ans="4">
    <p class="q" data-en="A 1000 W iron is used for 2 hours a day. The energy used in 30 days is" data-si="1000 W ඉස්ත්‍රික්කයක් දිනකට පැය 2ක් භාවිත කරයි. දින 30කදී වැය වන ශක්තිය"></p>
    <ol><li><button>2 kWh</button></li><li><button>30 kWh</button></li><li><button>2000 kWh</button></li><li><button>60 kWh</button></li></ol>
    <p class="why" data-en="1 kW × 2 h × 30 = 60 kWh (60 units)." data-si="1 kW × පැය 2 × 30 = 60 kWh (ඒකක 60)."></p>
  </div>
</section>

<!-- 10 summary -->
<section class="slide" data-id="summary">
  <span class="kick" data-en="Summary" data-si="සාරාංශය"></span>
  <h2 data-en="What we learned" data-si="මේ පාඩමෙන් අපි ඉගෙන ගත්තේ"></h2>
  <ol class="cards2">
    <li data-en="Current I in amperes (ammeter in series); voltage V in volts (voltmeter in parallel); resistance R in ohms." data-si="ධාරාව I ඇම්පියර්වලින් (ඇමීටරය ශ්‍රේණිගතව); වෝල්ටීයතාව V වෝල්ට්වලින් (වෝල්ට්මීටරය සමාන්තරව); ප්‍රතිරෝධය R ඕම්වලින්."></li>
    <li data-en="Ohm's law: V = IR." data-si="ඕම් නියමය: V = IR."></li>
    <li data-en="Series: one path, same current; R = R₁ + R₂. One bulb out → all go out." data-si="ශ්‍රේණිගත: එක් මාර්ගයක්, එකම ධාරාව; R = R₁ + R₂. එක් බල්බයක් නිවුණොත් සියල්ල නිවේ."></li>
    <li data-en="Parallel: many paths, same voltage; 1/R = 1/R₁ + 1/R₂. Homes are wired in parallel." data-si="සමාන්තර: මාර්ග කිහිපයක්, එකම වෝල්ටීයතාව; 1/R = 1/R₁ + 1/R₂. නිවාස රැහැන් ඇත්තේ සමාන්තරවයි."></li>
    <li data-en="P = VI; energy in kWh = kW × hours. 1 unit = 1 kWh." data-si="P = VI; kWh ශක්තිය = kW × පැය. ඒකක 1 = 1 kWh."></li>
    <li data-en="A fuse melts when the current is too big, protecting the wires." data-si="ධාරාව වැඩි වූ විට විලායකය දිය වී කම්බි ආරක්ෂා කරයි."></li>
  </ol>
</section>
