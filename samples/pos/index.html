<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samsoft POS – Demo</title>
<meta name="description" content="Samsoft POS demo: billing, barcode, stock, credit book and sales reports for small shops in Sri Lanka.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="pos.css">
</head>
<body>

<div class="demo-bar">
  <span class="demo-tag">DEMO</span>
  <span class="demo-msg" data-t="demoMsg"></span>
  <a class="demo-cta" id="waCta" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
    <span data-t="demoCta"></span>
  </a>
</div>

<div class="app">
  <aside class="side">
    <a class="brand" id="homeLink" href="../../website/index.html">
      <span class="brand-mark">S</span>
      <span class="brand-txt"><b>Samsoft</b> POS</span>
    </a>
    <nav class="nav" id="nav">
      <button data-act="nav" data-id="bill"><svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-2 2-2-2-2 2-2-2-3 2V3a1 1 0 0 1 1-1Zm2 5h8M8 11h8M8 15h5"/></svg><span data-t="nav_bill"></span></button>
      <button data-act="nav" data-id="sales"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="nav_sales"></span></button>
      <button data-act="nav" data-id="stock"><svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Zm0 0 9 4.5m0 0 9-4.5M12 12v9"/></svg><span data-t="nav_stock"></span><i class="nav-badge" id="lowBadge"></i></button>
      <button data-act="nav" data-id="credit"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3Zm4 6h6m-6 4h6m-6 4h3"/></svg><span data-t="nav_credit"></span></button>
      <button data-act="nav" data-id="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span data-t="nav_settings"></span></button>
    </nav>
    <div class="side-foot">
      <div class="offline-pill"><i></i><span data-t="offline"></span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="tb-left">
        <h1 id="pageTitle"></h1>
        <div class="tb-shop" id="shopName"></div>
      </div>
      <div class="tb-right">
        <div class="clock" id="clock"></div>
        <button class="lang" data-act="lang"><span class="lang-on">සිං</span><span class="lang-off">EN</span></button>
      </div>
    </header>

    <section class="page" id="pg-bill">
      <div class="bill-grid">
        <div class="catalog">
          <div class="search-row">
            <label class="search">
              <svg viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Zm9 3-4.3-4.3"/></svg>
              <input id="q" type="search" autocomplete="off" spellcheck="false">
              <kbd>F2</kbd>
            </label>
            <button class="scan-btn" data-act="tryscan">
              <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8m3-8v8m4-8v8m3-8v8"/></svg>
              <span data-t="scanDemo"></span>
            </button>
          </div>
          <div class="cats" id="cats"></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <aside class="cart" id="cart"></aside>
      </div>
      <button class="cart-fab" id="cartFab" data-act="opencart"></button>
    </section>

    <section class="page" id="pg-sales"></section>
    <section class="page" id="pg-stock"></section>
    <section class="page" id="pg-credit"></section>
    <section class="page" id="pg-settings"></section>
  </main>
</div>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toasts" id="toasts"></div>
<div id="printArea"></div>

<script src="data.js"></script>
<script src="pos.js"></script>
</body>
</html>
