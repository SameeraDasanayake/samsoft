<body data-page="sell">

<div class="demo-bar">
  <span class="demo-tag">DEMO</span>
  <span class="demo-msg" data-t="demoMsg"></span>
  <a class="demo-by" id="homeLink" href="../../website/business.html">Samsoft</a>
  <a class="demo-cta" id="waCta" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
    <span data-t="demoCta"></span>
  </a>
</div>

<header class="top">
  <div class="brand"><b>tikiri</b><span data-t="shopSub"></span></div>
  <nav class="tabs" id="tabs">
    <button data-act="nav" data-id="sell"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span data-t="nav_sell"></span></button>
    <button data-act="nav" data-id="hamper"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1.5S10 9 12 9Zm0 0c2-4 6-4 6-1.5S14 9 12 9Z"/></svg><span data-t="nav_hamper"></span></button>
    <button data-act="nav" data-id="stock"><svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Zm0 0 9 4.5 9-4.5M12 12v9"/></svg><span data-t="nav_stock"></span><i class="cnt" id="lowCnt"></i></button>
    <button data-act="nav" data-id="loyal"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg><span data-t="nav_loyal"></span></button>
    <button data-act="nav" data-id="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg><span data-t="nav_reports"></span></button>
  </nav>
  <div class="top-r">
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    <button class="lang" data-act="lang"><span class="l-en">EN</span><span class="l-si">සිං</span></button>
  </div>
</header>

<main class="main">
  <section class="page" id="pg-sell"></section>
  <section class="page" id="pg-hamper"></section>
  <section class="page" id="pg-stock"></section>
  <section class="page" id="pg-loyal"></section>
  <section class="page" id="pg-reports"></section>
</main>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<div id="print" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="fancy.js"></script>
